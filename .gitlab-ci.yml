stages:
  - deploy

deploy:
  stage: deploy
  image: alpine
  variables:
    GIT_DEPTH: 0
  only:
    - main
  script:
    - apk add --no-cache openssh-client git git-lfs
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh/
    - ssh-keyscan -H $HOST >> ~/.ssh/known_hosts_$PROJECT_NAME
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - GIT_SSH_COMMAND="ssh -o UserKNownHostsFile=~/.ssh/known_hosts_$PROJECT_NAME" git push -f dokku@$HOST:$PROJECT_NAME-$CI_COMMIT_REF_NAME $CI_COMMIT_SHA:refs/heads/main
