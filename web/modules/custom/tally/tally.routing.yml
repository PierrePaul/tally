# The public invoice link. Anyone with the token may open it, so access is
# open and the controller answers 404 for anything that is not a sent invoice:
# a 403 would send visitors to the sign-in screen and give the route away.
tally.public_invoice:
  path: '/i/{token}'
  defaults:
    _controller: '\Drupal\tally\Controller\PublicInvoiceController::page'
  requirements:
    _access: 'TRUE'
    _method: 'GET'

tally.public_invoice.pdf:
  path: '/i/{token}/pdf'
  defaults:
    _controller: '\Drupal\tally\Controller\PublicInvoiceController::pdf'
  requirements:
    _access: 'TRUE'
    _method: 'GET'

tally.invoices.pdf:
  path: '/invoices/{invoice}/pdf'
  defaults:
    _controller: '\Drupal\tally\Controller\InvoiceController::pdf'
  requirements:
    _permission: 'use tally'
    _method: 'GET'
    invoice: '\d+'

tally.public_invoice.pay:
  path: '/i/{token}/pay'
  defaults:
    _controller: '\Drupal\tally\Controller\PublicInvoiceController::pay'
  requirements:
    _access: 'TRUE'
    _method: 'POST'

# Stripe's webhook, one URL per user. Open access: the signature check in the controller is the lock.
tally.stripe.webhook:
  path: '/stripe/webhook/{endpoint}'
  defaults:
    _controller: '\Drupal\tally\Controller\StripeWebhookController::handle'
  requirements:
    _access: 'TRUE'
    _method: 'POST'
  options:
    no_cache: TRUE

tally.public_invoice.status:
  path: '/i/{token}/status'
  defaults:
    _controller: '\Drupal\tally\Controller\PublicInvoiceController::status'
  requirements:
    _access: 'TRUE'
    _method: 'GET'
