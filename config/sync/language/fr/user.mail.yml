password_reset:
  subject: 'Réinitialisation du mot de passe de [user:display-name] sur [site:name]'
  body: |-
    [user:display-name],

    Une demande de réinitialisation du mot de passe de votre compte a été faite sur [site:name].

    Vous pouvez maintenant vous connecter en cliquant sur ce lien ou en le copiant dans votre navigateur :

    [user:one-time-login-url]

    Ce lien ne peut être utilisé qu’une seule fois pour vous connecter et vous mènera à une page où vous pourrez choisir votre mot de passe. Il expire après un jour et rien ne se passera s’il n’est pas utilisé.

    --  L’équipe [site:name]
